name: Publish Girl Runner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          ref: b3ac37b351ff33c34c3eb35a18b13e32f7052b1d
          path: model-src
      - uses: actions/checkout@v4
        with:
          ref: feature/gameplay-animation-v2
          path: work-original
      - name: Restore the original V2 characters
        run: |
          python model-src/assets/characters/restore_v2.py
          mkdir -p site/assets/characters site/assets/gameplay-v2
          cp model-src/assets/characters/girl_avatar_v2.glb site/assets/characters/
          cp model-src/assets/characters/boy_avatar_v2.glb site/assets/characters/
      - name: Retain Work original and every existing game version
        run: |
          cp work-original/game_v2.html site/game_work_original.html
          cp -R work-original/assets/gameplay-v2/. site/assets/gameplay-v2/
          touch site/.nojekyll
      - name: Check complete game publication files
        run: |
          test -s site/game_complete.html
          test -s site/assets/gameplay-complete/game.js
          test -s site/assets/gameplay-complete/avatar-rig.js
          test -s site/assets/gameplay-complete/props.js
          test -s site/assets/gameplay-complete/mechanics.mjs
          test -s site/assets/gameplay-complete/styles.css
          test -s site/assets/characters/girl_avatar_v2.glb
          test -s site/assets/characters/boy_avatar_v2.glb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
