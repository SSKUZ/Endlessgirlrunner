name: Publish Girl Runner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          ref: b3ac37b351ff33c34c3eb35a18b13e32f7052b1d
          path: model-src
      - name: Restore the original V2 characters
        run: |
          python model-src/assets/characters/restore_v2.py
          mkdir -p site/assets/characters site/assets/gameplay-v2
          cp model-src/assets/characters/girl_avatar_v2.glb site/assets/characters/
          cp model-src/assets/characters/boy_avatar_v2.glb site/assets/characters/
      - name: Keep all game versions from main
        run: |
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
