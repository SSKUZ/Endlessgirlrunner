<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#233d3b">
  <title>Захар и Мира: Котонашествие — Совместная игра</title>
  <link rel="stylesheet" href="assets/gameplay-complete/styles.css?v=complete-1">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
  <style>
    #game-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:flex-end;justify-content:center;background:#17102b url('assets/gameplay-complete/cover.jpg') center center/cover no-repeat;}
    #game-splash[hidden]{display:none!important}
    #splash-play{position:absolute;left:25%;width:50%;bottom:4.5%;height:10%;border:0;background:transparent;color:transparent;cursor:pointer;touch-action:manipulation}
    #game-splash.fallback{background:radial-gradient(ellipse at 50% 40%,#7041a1,#17102b 72%)}
    #game-splash.fallback:before{content:'ЗАХАР И МИРА\\A КОТОНАШЕСТВИЕ';white-space:pre;text-align:center;position:absolute;top:19%;font:bold clamp(28px,7vw,58px) system-ui;color:#ffcd4d;text-shadow:0 3px 7px #16082e}
    #game-splash.fallback #splash-play{background:linear-gradient(#9e3ddb,#5e1b99);color:white;border-radius:32px;font:bold 24px system-ui;box-shadow:0 0 20px #b642f7}
    @media(orientation:landscape){#game-splash{background-size:contain;background-color:#100b20}#splash-play{left:37%;width:26%;bottom:3%;height:12%}}
  </style>
  <script>
    addEventListener('DOMContentLoaded',()=>{
      const splash=document.getElementById('game-splash');
      const image=new Image();image.onerror=()=>splash.classList.add('fallback');image.src='assets/gameplay-complete/cover.jpg';
      document.getElementById('splash-play').addEventListener('click',()=>{splash.hidden=true;});
    });
  </script>
</head>
<body>
  <div id="game-splash" role="dialog" aria-label="Заставка игры"><button id="splash-play" type="button" aria-label="Играть">▶ ИГРАТЬ</button></div>
  <main id="selection" class="selection">
    <header class="masthead"><span class="eyebrow">ЗАХАР И МИРА</span><h1>Котонашествие</h1><p id="step-label">01 / ВЫБЕРИ ГЕРОЯ</p></header>
    <button id="back" class="back" type="button" hidden aria-label="Назад к персонажам">←</button>
    <div id="carousel" class="carousel" aria-label="Свайп для выбора">
      <button id="previous" class="arrow previous" type="button" aria-label="Предыдущий">‹</button>
      <button id="next" class="arrow next" type="button" aria-label="Следующий">›</button>
    </div>
    <section class="selection-footer">
      <div id="dots" class="dots" aria-hidden="true"><i class="active"></i><i></i></div>
      <h2 id="choice-name">МИРА</h2><p id="choice-description">Смелость, косичка и отличный бросок.</p>
      <p id="loading" role="status" aria-live="polite">Загружаем 3D-персонажей…</p>
      <button id="select" class="primary" type="button" disabled>ВЫБРАТЬ ПЕРСОНАЖА <span>→</span></button>
      <button id="retry" class="text-button" type="button" hidden>ПОВТОРИТЬ ЗАГРУЗКУ</button>
      <small>Свайпни или нажми стрелку</small>
    </section>
  </main>
  <div id="hud" hidden>
    <div class="level-line"><span id="level-number">01 / 05</span><strong id="level-name">Солнечный двор</strong><button id="pause" aria-label="Пауза" type="button">Ⅱ</button></div>
    <div class="stats"><span id="hearts">♥ ♥ ♥ ♥ ♥</span><span id="points">★ 0</span><span id="score">0 / 5</span></div>
    <div class="progress"><div id="progress-fill"></div></div>
  </div>
  <div id="notice" aria-live="polite"></div><div id="tutorial" hidden></div><div id="rewards" aria-live="polite"></div>
  <div id="controls" hidden>
    <div id="stick" aria-label="Джойстик движения"><span class="stick-ring"></span><span id="nub"></span></div>
    <button id="fire" type="button" aria-label="Бросить предмет"><span id="item-symbol">🌭</span><b>БРОСОК</b></button>
    <button id="bomb-select" type="button" aria-label="Выбрать бомбочки" aria-pressed="false">💣 <span id="bomb-count">×10</span></button><p class="control-hint">Пальцем — обзор · двумя — приближение</p>
  </div>
  <section id="end" class="modal" hidden><div class="modal-card"><span class="eyebrow">КОТОНАШЕСТВИЕ</span><h2 id="end-title"></h2><p id="end-score"></p><button id="again" class="primary" type="button">ЕЩЁ РАЗ <span>↗</span></button></div></section>
  <section id="pause-screen" class="modal" hidden><div class="modal-card"><span class="eyebrow">МОЖНО ВЫДОХНУТЬ</span><h2>Пауза</h2><p>Коты тоже немного отдохнут.</p><button id="resume" class="primary" type="button">ПРОДОЛЖИТЬ <span>→</span></button><button id="to-menu" class="text-button" type="button">К ВЫБОРУ ПЕРСОНАЖА</button></div></section>
  <noscript>Для игры необходимо включить JavaScript в браузере.</noscript>
  <script type="module" src="assets/gameplay-complete/game_coop.js?v=coop-1"></script>
</body>
</html>
