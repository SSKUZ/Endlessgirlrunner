<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endless Girl Runner — персонажи V2</title><style>body{margin:0;background:#e8edf6;font-family:system-ui;color:#273247}canvas{display:block;touch-action:none}.top{position:fixed;top:12px;left:12px;right:12px;text-align:center;pointer-events:none}.top h2{margin:0;font-size:20px}.top p{margin:5px;font-size:13px}.buttons{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:12px}button{font:600 17px system-ui;padding:13px 23px;border:0;border-radius:18px;background:white;box-shadow:0 4px 14px #0002}button.active{background:#ffdd88}#status{position:fixed;top:82px;width:100%;text-align:center;font-size:13px;color:#755}</style></head><body><div class="top"><h2>Endless Girl Runner</h2><p>Выбери персонажа • вращай пальцем • приближай двумя пальцами</p></div><div id="status">Загрузка 3D-модели…</div><div class="buttons"><button id="girl" class="active">👧 Девочка</button><button id="boy">👦 Мальчик</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8edf6');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,50);camera.position.set(0,1.12,2.65);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xadb7c6,2.4));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-2,4,4);scene.add(light);
const floor=new THREE.Mesh(new THREE.CircleGeometry(1.25,48),new THREE.MeshStandardMaterial({color:0xd7deeb}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.67,0);controls.enableDamping=true;controls.minDistance=1;controls.maxDistance=5;controls.maxPolarAngle=Math.PI*.82;controls.update();
const loader=new GLTFLoader();const cache={};let current=null,seq=0;const status=document.getElementById('status');
async function select(which){const id=++seq;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===which));status.textContent='Загрузка '+(which==='girl'?'девочки':'мальчика')+'…';try{if(!cache[which]){cache[which]=await loader.loadAsync('assets/characters/'+which+'_avatar_v2.glb');}if(id!==seq)return;if(current)scene.remove(current);current=cache[which].scene;scene.add(current);current.position.set(0,0,0);current.rotation.set(0,0,0);status.textContent='';}catch(e){if(id===seq)status.textContent='Ошибка загрузки модели: '+e.message;console.error(e)}}
document.getElementById('girl').onclick=()=>select('girl');document.getElementById('boy').onclick=()=>select('boy');select('girl');function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
